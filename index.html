    <script>
      // Pick the theme before first paint so there is no flash. The real
      // sun position for Lalitpur is computed by the app once it boots;
      // this is a fast approximation from Nepal time.
      (function () {
        try {
          var saved = localStorage.getItem('ss-theme');
          var mode = saved === 'day' || saved === 'night' ? saved : null;
          if (!mode) {
            var h = Number(new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Kathmandu', hour: 'numeric', hour12: false }).format(new Date()));
            mode = h >= 6 && h < 18 ? 'day' : 'night';
          }
          document.documentElement.dataset.theme = mode;
        } catch (e) {
          document.documentElement.dataset.theme = 'night';
        }
      })();
    </script>
